name: ai-access

# Tamper evidence for the AI access controls: a change that deletes, weakens or
# desynchronises a guard file fails this job. It runs only offline checks and
# never starts an AI client. It is evidence, not prevention: pair it with branch
# protection so that a failing run actually blocks the merge.
on:
  pull_request: {}
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  guards:
    name: Check AI access guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 .ai-access/test_guards.py
